<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: "IBM Plex Sans", "PingFang SC", "Noto Sans SC", system-ui, sans-serif; color: #1E2229; }
    a { color: #1F6F78; } a:hover { color: #164F56; }
    svg text { font-family: inherit; }
  </style>
</helmet>
<div style="width: 1200px; height: 800px; box-sizing: border-box; background: #FFFFFF; padding: 32px 40px; display: flex; flex-direction: column; gap: 12px;">
  <div style="display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #D5D8DD; padding-bottom: 10px;">
    <div style="font-size: 20px; font-weight: 600;">C1 · 系统上下文图（C4 Level 1）</div>
    <div style="font-size: 12px; color: #6B7280;">where-my-job · 设计 v3（Codex 三轮评审收敛版）· 2026-09-14</div>
  </div>
  <svg width="1120" height="680" viewBox="0 0 1120 680">
    <defs>
      <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#2F3640"/></marker>
    </defs>
    <rect x="20" y="20" width="1080" height="500" rx="6" fill="none" stroke="#9AA0A8" stroke-width="1" stroke-dasharray="6 4"/>
    <text x="34" y="42" font-size="12" fill="#6B7280">用户本机。CLI：无遥测、本地存储、不持有凭证。agent 出站数据流由用户环境决定，不在 CLI 承诺内</text>

    <rect x="60" y="70" width="220" height="90" rx="4" fill="#F1E8F4" stroke="#6B3F7A" stroke-width="1.5"/>
    <text x="170" y="100" font-size="14" font-weight="600" text-anchor="middle">求职者</text>
    <text x="170" y="120" font-size="12" text-anchor="middle" fill="#3C4858">[Person]</text>
    <text x="170" y="140" font-size="12" text-anchor="middle" fill="#3C4858">最小化需求与摘要、拍板、点名深挖、记录事件</text>

    <rect x="840" y="70" width="220" height="90" rx="4" fill="#FBF1E1" stroke="#B8741A" stroke-width="1.5"/>
    <text x="950" y="100" font-size="14" font-weight="600" text-anchor="middle">Coding Agent</text>
    <text x="950" y="120" font-size="12" text-anchor="middle" fill="#3C4858">[External System · 用户已有]</text>
    <text x="950" y="140" font-size="12" text-anchor="middle" fill="#3C4858">首发实测 Claude Code；其他 agent 手动加载</text>

    <rect x="410" y="270" width="300" height="130" rx="4" fill="#E4F0F1" stroke="#1F6F78" stroke-width="2"/>
    <text x="560" y="300" font-size="16" font-weight="600" text-anchor="middle">where-my-job</text>
    <text x="560" y="320" font-size="12" text-anchor="middle" fill="#3C4858">[Software System] CLI（确定性）+ SKILL.md</text>
    <text x="560" y="342" font-size="12" text-anchor="middle" fill="#3C4858">网络门禁 · 响应适配 · 存储 · 规则匹配</text>
    <text x="560" y="360" font-size="12" text-anchor="middle" fill="#3C4858">证据包 · 原子报告 · 事件流 · 面板</text>
    <text x="560" y="382" font-size="11" text-anchor="middle" fill="#6B7280">不调用 LLM，不回调 agent，不含 API key</text>

    <rect x="60" y="285" width="220" height="90" rx="4" fill="#EEF0F3" stroke="#3C4858" stroke-width="1.5"/>
    <text x="170" y="315" font-size="14" font-weight="600" text-anchor="middle">默认浏览器</text>
    <text x="170" y="335" font-size="12" text-anchor="middle" fill="#3C4858">[External System]</text>
    <text x="170" y="355" font-size="12" text-anchor="middle" fill="#3C4858">展示本地 HTML 面板（无外部资源）</text>

    <rect x="410" y="420" width="300" height="80" rx="4" fill="#EEF0F3" stroke="#3C4858" stroke-width="1.5"/>
    <text x="560" y="446" font-size="14" font-weight="600" text-anchor="middle">专用 Chrome（自有启动器）</text>
    <text x="560" y="464" font-size="12" text-anchor="middle" fill="#3C4858">[External System · 隔离 profile · 用户手动登录]</text>
    <text x="560" y="482" font-size="12" text-anchor="middle" fill="#3C4858">CDP 仅回环；不带 --remote-allow-origins=*</text>

    <rect x="60" y="550" width="220" height="80" rx="4" fill="#EEF0F3" stroke="#3C4858" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="170" y="576" font-size="14" font-weight="600" text-anchor="middle">BOSS直聘 zhipin.com</text>
    <text x="170" y="594" font-size="12" text-anchor="middle" fill="#3C4858">[External System · 站外]</text>
    <text x="170" y="612" font-size="12" text-anchor="middle" fill="#3C4858">平台协议未核验 = 在线功能发布门槛</text>

    <rect x="840" y="550" width="220" height="80" rx="4" fill="#EEF0F3" stroke="#3C4858" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="950" y="576" font-size="14" font-weight="600" text-anchor="middle">站外信息源 / 模型提供商</text>
    <text x="950" y="594" font-size="12" text-anchor="middle" fill="#3C4858">[External System · 可选]</text>
    <text x="950" y="612" font-size="12" text-anchor="middle" fill="#3C4858">新闻 · 工商 MCP · agent 的 LLM 后端</text>

    <line x1="280" y1="115" x2="838" y2="115" stroke="#2F3640" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="560" y="106" font-size="12" text-anchor="middle">自然语言：需求、访谈回答（agent 先告知处理边界）、拍板</text>

    <line x1="900" y1="160" x2="712" y2="290" stroke="#2F3640" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="826" y="212" font-size="12" fill="#1E2229">读 SKILL.md；写候选 JSON 并 validate / register；调用 CLI</text>
    <text x="826" y="229" font-size="12" fill="#6B7280">← JSON envelope：证据包 / 时间线 / 校验错误 / 退出码</text>

    <line x1="200" y1="160" x2="418" y2="272" stroke="#2F3640" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
    <text x="226" y="222" font-size="12" fill="#6B7280">无 agent 的规则模式：手写配置即可用</text>

    <line x1="410" y1="330" x2="282" y2="330" stroke="#2F3640" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="346" y="322" font-size="12" text-anchor="middle">打开 file:// 面板</text>
    <line x1="170" y1="285" x2="170" y2="162" stroke="#2F3640" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="180" y="230" font-size="12">看面板</text>

    <line x1="560" y1="400" x2="560" y2="418" stroke="#2F3640" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="574" y="412" font-size="12">经网络门禁：预算 · 冷却 · 逐响应风控 · ws://127.0.0.1:9222</text>

    <line x1="440" y1="500" x2="262" y2="552" stroke="#2F3640" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="300" y="518" font-size="12">HTTPS · 用户登录态</text>

    <line x1="950" y1="160" x2="950" y2="548" stroke="#B8741A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
    <text x="960" y="320" font-size="12" fill="#1E2229">agent 自身工具与模型调用</text>
    <text x="960" y="337" font-size="12" fill="#6B7280">WebFetch / MCP / 提供商 API</text>
    <text x="960" y="354" font-size="12" fill="#6B7280">CLI 不参与，也不承诺其数据流</text>

    <rect x="20" y="640" width="1080" height="36" fill="#F7F8FA"/>
    <rect x="34" y="652" width="14" height="12" fill="#E4F0F1" stroke="#1F6F78"/><text x="54" y="662" font-size="11" fill="#3C4858">本系统</text>
    <rect x="120" y="652" width="14" height="12" fill="#F1E8F4" stroke="#6B3F7A"/><text x="140" y="662" font-size="11" fill="#3C4858">人</text>
    <rect x="180" y="652" width="14" height="12" fill="#FBF1E1" stroke="#B8741A"/><text x="200" y="662" font-size="11" fill="#3C4858">用户已有 agent</text>
    <rect x="300" y="652" width="14" height="12" fill="#EEF0F3" stroke="#3C4858"/><text x="320" y="662" font-size="11" fill="#3C4858">外部系统（实线本机 / 虚线站外）</text>
    <text x="600" y="662" font-size="11" fill="#3C4858">永不做：自动投递 · 服务端 · 多用户汇聚 · 岗位真实性数据库 · 内建 LLM</text>
  </svg>
</div>
</x-dc>
</body>
</html>
