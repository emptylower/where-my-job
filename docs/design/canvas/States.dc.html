<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: "IBM Plex Sans", "PingFang SC", "Noto Sans SC", system-ui, sans-serif; color: #1E2229; }
    a { color: #1F6F78; } a:hover { color: #164F56; }
    svg text { font-family: inherit; }
  </style>
</helmet>
<div style="width: 1200px; height: 840px; box-sizing: border-box; background: #FFFFFF; padding: 32px 40px; display: flex; flex-direction: column; gap: 12px;">
  <div style="display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #D5D8DD; padding-bottom: 10px;">
    <div style="font-size: 20px; font-weight: 600;">D3 · 状态机（四个独立维度，不合并成一个 lifecycle）</div>
    <div style="font-size: 12px; color: #6B7280;">设计 v3 §4.2、§4.3、§7、§8、§12</div>
  </div>
  <svg width="1120" height="710" viewBox="0 0 1120 710">
    <defs>
      <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#2F3640"/></marker>
    </defs>

    <text x="20" y="22" font-size="13" font-weight="600">① run 终态（runs.status）</text>
    <circle cx="36" cy="70" r="7" fill="#2F3640"/><line x1="43" y1="70" x2="78" y2="70" stroke="#2F3640" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="80" y="50" width="110" height="40" rx="10" fill="#FFFFFF" stroke="#2F3640" stroke-width="1.5"/><text x="135" y="75" font-size="12" font-weight="600" text-anchor="middle">created</text>
    <rect x="240" y="50" width="110" height="40" rx="10" fill="#FFFFFF" stroke="#2F3640" stroke-width="1.5"/><text x="295" y="75" font-size="12" font-weight="600" text-anchor="middle">running</text>
    <rect x="430" y="20" width="100" height="36" rx="10" fill="#E4F0F1" stroke="#1F6F78" stroke-width="1.5"/><text x="480" y="43" font-size="12" font-weight="600" text-anchor="middle">ok</text>
    <rect x="430" y="64" width="100" height="36" rx="10" fill="#FBE4EE" stroke="#A8336B" stroke-width="1.5"/><text x="480" y="87" font-size="12" font-weight="600" text-anchor="middle">blocked</text>
    <rect x="430" y="108" width="100" height="36" rx="10" fill="#FFF8EE" stroke="#B8741A" stroke-width="1.5"/><text x="480" y="131" font-size="12" font-weight="600" text-anchor="middle">partial</text>
    <rect x="430" y="152" width="100" height="36" rx="10" fill="#F7F8FA" stroke="#2F3640" stroke-width="1.5"/><text x="480" y="175" font-size="12" font-weight="600" text-anchor="middle">failed</text>
    <rect x="430" y="196" width="100" height="36" rx="10" fill="#F7F8FA" stroke="#2F3640" stroke-width="1.5"/><text x="480" y="219" font-size="12" font-weight="600" text-anchor="middle">cancelled</text>
    <line x1="190" y1="70" x2="238" y2="70" stroke="#2F3640" stroke-width="1.5" marker-end="url(#ar)"/><text x="214" y="62" font-size="9" text-anchor="middle">取锁·预占</text>
    <path d="M295 50 C 275 20, 315 20, 295 50" fill="none" stroke="#2F3640" stroke-width="1.5" marker-end="url(#ar)"/><text x="295" y="16" font-size="9" text-anchor="middle">每动作：门禁→响应→判风控→等待≥12s</text>
    <line x1="350" y1="60" x2="428" y2="38" stroke="#2F3640" stroke-width="1.5" marker-end="url(#ar)"/><text x="380" y="38" font-size="9">计划完成</text>
    <line x1="350" y1="70" x2="428" y2="82" stroke="#2F3640" stroke-width="1.5" marker-end="url(#ar)"/><text x="360" y="90" font-size="9">31/37/验证码→冷却，退出 3</text>
    <line x1="350" y1="80" x2="428" y2="126" stroke="#2F3640" stroke-width="1.5" marker-end="url(#ar)"/><text x="360" y="120" font-size="9">未知错误且已有结果，退出 4</text>
    <line x1="350" y1="88" x2="428" y2="170" stroke="#2F3640" stroke-width="1.5" marker-end="url(#ar)"/><text x="352" y="152" font-size="9">无有效结果，按失败类别退出 2</text>
    <line x1="340" y1="90" x2="428" y2="214" stroke="#2F3640" stroke-width="1.5" marker-end="url(#ar)"/><text x="340" y="196" font-size="9">用户取消</text>
    <text x="560" y="36" font-size="10" fill="#6B7280">进程中断：下次启动把遗留 running 标为</text>
    <text x="560" y="50" font-size="10" fill="#6B7280">interrupted/failed，数据保留；新尝试新 run_id</text>
    <text x="560" y="68" font-size="10" fill="#6B7280">+ parent_run。锁自动释放，账本持久。</text>
    <text x="560" y="90" font-size="10" fill="#6B7280">blocked 即使已保存数据也不降成 partial。</text>

    <line x1="20" y1="250" x2="1100" y2="250" stroke="#D5D8DD"/>
    <text x="20" y="276" font-size="13" font-weight="600">② 报告与采集（deepdives / evidence_bundles，两个独立字段）</text>
    <rect x="30" y="300" width="110" height="40" rx="10" fill="#F7F8FA" stroke="#2F3640" stroke-width="1.5"/><text x="85" y="325" font-size="12" font-weight="600" text-anchor="middle">none</text>
    <rect x="200" y="300" width="150" height="40" rx="10" fill="#FFF8EE" stroke="#B8741A" stroke-width="1.5"/><text x="275" y="325" font-size="12" font-weight="600" text-anchor="middle">analysis_pending</text>
    <rect x="410" y="300" width="110" height="40" rx="10" fill="#E4F0F1" stroke="#1F6F78" stroke-width="1.5"/><text x="465" y="325" font-size="12" font-weight="600" text-anchor="middle">complete</text>
    <rect x="580" y="300" width="110" height="40" rx="10" fill="#F7F8FA" stroke="#2F3640" stroke-width="1.5" stroke-dasharray="4 3"/><text x="635" y="325" font-size="12" font-weight="600" text-anchor="middle">stale</text>
    <line x1="140" y1="320" x2="198" y2="320" stroke="#2F3640" stroke-width="1.5" marker-end="url(#ar)"/><text x="169" y="312" font-size="9" text-anchor="middle">deepdive 写 bundle</text>
    <line x1="350" y1="320" x2="408" y2="320" stroke="#2F3640" stroke-width="1.5" marker-end="url(#ar)"/><text x="379" y="312" font-size="9" text-anchor="middle">report set 原子提交</text>
    <line x1="520" y1="320" x2="578" y2="320" stroke="#2F3640" stroke-width="1.5" marker-end="url(#ar)"/><text x="549" y="312" font-size="9" text-anchor="middle">新 bundle/画像/事实版本</text>
    <path d="M635 340 L635 370 L275 370 L275 342" fill="none" stroke="#2F3640" stroke-width="1.5" marker-end="url(#ar)"/><text x="455" y="384" font-size="9" text-anchor="middle">新 deepdive → 新包待分析；旧完整报告保留为历史</text>
    <text x="720" y="300" font-size="11" font-weight="600">acquisition_state（bundle）</text>
    <text x="720" y="318" font-size="11" fill="#3C4858">complete｜partial，由采集结果决定；</text>
    <text x="720" y="334" font-size="11" fill="#3C4858">不因结论"证据不足"或报告提交改变。</text>
    <text x="720" y="356" font-size="11" fill="#3C4858">report_state=complete 要求：非空 report_md、</text>
    <text x="720" y="372" font-size="11" fill="#3C4858">结论 ∈ 三值、引用可定位；信号数组允许为空。</text>

    <line x1="20" y1="410" x2="1100" y2="410" stroke="#D5D8DD"/>
    <text x="20" y="436" font-size="13" font-weight="600">③ 匹配（v_jobs.match_state）</text>
    <rect x="30" y="456" width="100" height="36" rx="10" fill="#F7F8FA" stroke="#2F3640" stroke-width="1.5"/><text x="80" y="479" font-size="12" font-weight="600" text-anchor="middle">missing</text>
    <rect x="190" y="456" width="100" height="36" rx="10" fill="#E4F0F1" stroke="#1F6F78" stroke-width="1.5"/><text x="240" y="479" font-size="12" font-weight="600" text-anchor="middle">current</text>
    <rect x="350" y="456" width="100" height="36" rx="10" fill="#F7F8FA" stroke="#2F3640" stroke-width="1.5" stroke-dasharray="4 3"/><text x="400" y="479" font-size="12" font-weight="600" text-anchor="middle">stale</text>
    <line x1="130" y1="474" x2="188" y2="474" stroke="#2F3640" stroke-width="1.5" marker-end="url(#ar)"/><text x="159" y="466" font-size="9" text-anchor="middle">match 批次成功</text>
    <line x1="290" y1="474" x2="348" y2="474" stroke="#2F3640" stroke-width="1.5" marker-end="url(#ar)"/><text x="319" y="466" font-size="9" text-anchor="middle">事实/画像/scoring 变</text>
    <path d="M400 492 L400 516 L240 516 L240 494" fill="none" stroke="#2F3640" stroke-width="1.5" marker-end="url(#ar)"/><text x="320" y="530" font-size="9" text-anchor="middle">重跑 match（失败则保留旧批次）</text>
    <text x="480" y="470" font-size="11" fill="#3C4858">输入 = 事实版本 + 画像摘要版本 + scoring 哈希 + 引擎版本 + as_of；</text>
    <text x="480" y="486" font-size="11" fill="#3C4858">excluded：1 明确排除 / 0 已评估未排除 / NULL 尚未评估（不当作合格）。</text>

    <line x1="20" y1="550" x2="1100" y2="550" stroke="#D5D8DD"/>
    <text x="20" y="576" font-size="13" font-weight="600">④ 投递（内置流 applications，由有效事件派生）</text>
    <circle cx="36" cy="620" r="7" fill="#2F3640"/><line x1="43" y1="620" x2="78" y2="620" stroke="#2F3640" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="80" y="600" width="100" height="40" rx="10" fill="#FFFFFF" stroke="#2F3640" stroke-width="1.5"/><text x="130" y="625" font-size="12" font-weight="600" text-anchor="middle">applied</text>
    <rect x="240" y="600" width="100" height="40" rx="10" fill="#FFFFFF" stroke="#2F3640" stroke-width="1.5"/><text x="290" y="625" font-size="12" font-weight="600" text-anchor="middle">replied</text>
    <rect x="400" y="600" width="100" height="40" rx="10" fill="#FFFFFF" stroke="#2F3640" stroke-width="1.5"/><text x="450" y="625" font-size="12" font-weight="600" text-anchor="middle">interview</text>
    <rect x="560" y="580" width="100" height="36" rx="10" fill="#E4F0F1" stroke="#1F6F78" stroke-width="1.5"/><text x="610" y="603" font-size="12" font-weight="600" text-anchor="middle">offer</text>
    <rect x="560" y="624" width="100" height="36" rx="10" fill="#F7F8FA" stroke="#2F3640" stroke-width="1.5"/><text x="610" y="647" font-size="12" font-weight="600" text-anchor="middle">rejected</text>
    <rect x="560" y="668" width="100" height="36" rx="10" fill="#F7F8FA" stroke="#2F3640" stroke-width="1.5"/><text x="610" y="691" font-size="12" font-weight="600" text-anchor="middle">withdrawn</text>
    <line x1="180" y1="620" x2="238" y2="620" stroke="#2F3640" stroke-width="1.5" marker-end="url(#ar)"/><text x="209" y="612" font-size="9" text-anchor="middle">最早有效 replied</text>
    <line x1="340" y1="620" x2="398" y2="620" stroke="#2F3640" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="500" y1="610" x2="558" y2="598" stroke="#2F3640" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="500" y1="625" x2="558" y2="642" stroke="#2F3640" stroke-width="1.5" marker-end="url(#ar)"/>
    <path d="M130 640 L130 686 L558 686" fill="none" stroke="#2F3640" stroke-width="1.5" marker-end="url(#ar)"/><text x="340" y="700" font-size="9" text-anchor="middle">任一阶段可 withdrawn / rejected</text>
    <text x="690" y="590" font-size="11" fill="#3C4858">状态 = 解析纠错链（replace/retract）后，按发生时间、记录时间、ID 派生。</text>
    <text x="690" y="606" font-size="11" fill="#3C4858">72 小时未回复 → followup_due=1（独立提醒列），不是状态转移，不推导拒绝或养鱼。</text>
    <text x="690" y="622" font-size="11" fill="#3C4858">一个岗位可多次投递；默认关注最近有效 applied。</text>
    <text x="690" y="644" font-size="11" fill="#6B7280">不存在"岗位下线""疑似养鱼"状态：只有事实列"观察跨度 ≥ T 天、累计观察 N 次"。</text>
    <text x="690" y="660" font-size="11" fill="#6B7280">自定义流不要求状态机，仅通用时间线。</text>
  </svg>
</div>
</x-dc>
</body>
</html>
